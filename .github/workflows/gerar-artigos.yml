name: Gerar artigos

on:
  workflow_dispatch:

jobs:
  gerar-artigo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4
      - name: Verificar acesso ao Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://generativelanguage.googleapis.com/v1beta/models"

          request = urllib.request.Request(
              url,
              headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"]
              },
              method="GET"
          )

          with urllib.request.urlopen(request) as response:
              resultado = json.loads(response.read().decode("utf-8"))

          print("Modelos disponíveis:")

          for model in resultado.get("models", []):
              print(model.get("name"))
          PY

      - name: Salvar artigo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artigos.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Adicionar artigo gerado automaticamente"
            git push
          fi
