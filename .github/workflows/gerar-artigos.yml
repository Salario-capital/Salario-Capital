name: Gerar artigos

on:
  workflow_dispatch:

jobs:
  gerar-artigo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Testar geração do Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": "Responda apenas: TESTE OK"
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"]
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  resultado = json.loads(response.read().decode("utf-8"))

              print("RESPOSTA DO GEMINI:")
              print(json.dumps(resultado, ensure_ascii=False, indent=2))

          except urllib.error.HTTPError as e:
              print("ERRO HTTP:", e.code)
              print(e.read().decode("utf-8"))
              raise
          PY

      - name: Salvar artigo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artigos.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Adicionar artigo gerado automaticamente"
            git push
          fi
